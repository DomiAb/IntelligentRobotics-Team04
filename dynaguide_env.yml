name: dynaguide_env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
    - einops
    - scikit-learn

    # PyTorch stack — pinned to what dsrl/dppo (installed later by setup_environment.sh)
    # requires anyway (torch==2.4.0, see dsrl/dppo/pyproject.toml), so it doesn't get
    # silently upgraded mid-setup. torchvision/torchaudio must match the torch version.
    - torch==2.4.0
    - torchvision==0.19.0
    - torchaudio==2.4.0
    # robomimic's diffusion policy needs diffusers>=0.26.2 (robomimic/setup.py), but
    # anything <0.29.2 still imports the removed huggingface_hub.cached_download and
    # fails at import time with a modern huggingface_hub.
    - diffusers==0.29.2
    # robosuite only requires mujoco>=2.3.0 (unbounded), which pulls in a version far
    # too new for this fork and breaks robot joint setup at env creation.
    - mujoco==3.1.6
    - numpy<2.0
